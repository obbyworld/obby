<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>YouTube</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <script>
      // The installed apps load from a custom scheme that sends YouTube no
      // referrer, which it rejects with error 153, so they embed through this
      // page on a real https origin.
      const id = new URLSearchParams(location.search).get("v") ?? "";
      if (/^[A-Za-z0-9_-]{11}$/.test(id)) {
        const frame = document.createElement("iframe");
        frame.src = `https://www.youtube.com/embed/${id}?playsinline=1&autoplay=1`;
        frame.allow =
          "autoplay; encrypted-media; picture-in-picture; fullscreen";
        frame.allowFullscreen = true;
        frame.referrerPolicy = "strict-origin-when-cross-origin";
        document.body.append(frame);
      }
    </script>
  </body>
</html>
