[package]
name = "tauri-plugin-mobile-notifications"
version = "0.1.0"
edition = "2021"
build = "build.rs"
links = "tauri-plugin-mobile-notifications"

[lib]
name = "tauri_plugin_mobile_notifications"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
