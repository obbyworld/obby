<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>YouTube</title>
    <style>
      html, body, #player { margin: 0; width: 100%; height: 100%; background: #000; }
      iframe { display: block; border: 0; }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <script>
      // The iOS and macOS apps serve this page from loopback so the embed has
      // an http origin; their tauri: scheme sends YouTube no referrer. The app
      // drives the player through the messages below, as it drives react-player.
      const params = new URLSearchParams(location.search);
      const id = params.get("v") ?? "";
      const start = Math.max(0, Math.floor(Number(params.get("start")) || 0));
      const send = (type, extra) =>
        window.parent.postMessage({ source: "obby-yt", type, ...extra }, "*");

      let player = null;
      let pendingCommand = null;
      let timeTimer = null;

      const sendTime = () => send("time", { time: player.getCurrentTime() });
      const run = (command) => {
        if (command.cmd === "play") player.playVideo();
        else if (command.cmd === "pause") player.pauseVideo();
        else if (command.cmd === "seek") player.seekTo(command.time, true);
      };

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        if (event.data?.source !== "obby-yt-cmd") return;
        if (player?.playVideo) run(event.data);
        else pendingCommand = event.data;
      });

      window.onYouTubeIframeAPIReady = () => {
        player = new YT.Player("player", {
          videoId: id,
          width: "100%",
          height: "100%",
          playerVars: { playsinline: 1, rel: 0, start },
          events: {
            onReady: () => {
              send("ready");
              if (pendingCommand) run(pendingCommand);
            },
            onStateChange: (event) => {
              if (event.data === YT.PlayerState.PLAYING) {
                send("play");
                clearInterval(timeTimer);
                timeTimer = setInterval(sendTime, 1000);
              } else if (event.data === YT.PlayerState.PAUSED) {
                clearInterval(timeTimer);
                sendTime();
                send("pause");
              } else if (event.data === YT.PlayerState.ENDED) {
                clearInterval(timeTimer);
                send("ended");
              }
            },
            onError: () => send("error"),
          },
        });
      };

      if (/^[A-Za-z0-9_-]{11}$/.test(id)) {
        const api = document.createElement("script");
        api.src = "https://www.youtube.com/iframe_api";
        document.head.append(api);
      }
    </script>
  </body>
</html>
