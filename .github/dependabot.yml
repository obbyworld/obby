version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # Matches the deep-link crate, pinned in src-tauri/Cargo.toml.
      - dependency-name: "@tauri-apps/plugin-deep-link"
        versions: ["2.6.2"]

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: "tauri"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: "tauri-build"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: "tauri-plugin-*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # 2.6.2 does not compile on Linux, see the pin in src-tauri/Cargo.toml.
      - dependency-name: "tauri-plugin-deep-link"
        versions: ["2.6.2"]

  - package-ecosystem: github-actions
    directory: "/"
    # Monthly, grouped into one PR. Actions are SHA-pinned with a `# vX.Y.Z`
    # comment, so Dependabot bumps both the SHA and the comment in place.
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    groups:
      actions-all:
        patterns:
          - "*"
    ignore:
      # Pinned to the stable/nightly branch tip on purpose — the channel resolves
      # at runtime, so there's no version for Dependabot to track.
      - dependency-name: "dtolnay/rust-toolchain"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
