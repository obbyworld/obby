pre-commit:
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: |
        npx biome check --no-errors-on-unmatched --files-ignore-unknown=true --write {staged_files}
        BIOME_EXIT=$?
        # If biome modified any staged file, re-stage the fixes and abort so the
        # commit includes the corrected versions on the next attempt.
        if ! git diff --exit-code --quiet -- {staged_files} 2>/dev/null; then
          git add -- {staged_files}
          echo ""
          echo "Biome auto-fixed the staged files. Changes have been staged."
          echo "Re-run git commit to proceed."
          exit 1
        fi
        exit $BIOME_EXIT
    i18n:
      glob: "src/**/*.{ts,tsx}"
      run: |
        set -e
        npm run i18n:extract
        npm run i18n:compile
        # If extract/compile touched any catalog file, stage the updates and abort
        # so the new/updated .po and .mjs files ride in the same commit next time.
        if ! git diff --exit-code --quiet src/locales/ 2>/dev/null; then
          git add src/locales/
          echo ""
          echo "i18n catalogs updated (new strings found or compiled output changed)."
          echo "Catalog changes have been staged. Re-run git commit to proceed."
          exit 1
        fi
    rust-fmt:
      glob: "src-tauri/**/*.rs"
      run: |
        set -e
        cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
        cargo fmt --manifest-path src-tauri/plugins/share-sheet/Cargo.toml --all -- --check
        cargo fmt --manifest-path src-tauri/plugins/ios-keyboard/Cargo.toml --all -- --check
    rust-clippy:
      glob: "src-tauri/**/*.rs"
      run: |
        set -e
        cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --no-deps -- -D warnings
        cargo clippy --manifest-path src-tauri/plugins/share-sheet/Cargo.toml --all-targets --no-deps -- -D warnings
        cargo clippy --manifest-path src-tauri/plugins/ios-keyboard/Cargo.toml --all-targets --no-deps -- -D warnings
    swift-format:
      glob: "src-tauri/plugins/*/ios/Sources/**/*.swift"
      run: |
        if ! xcrun --find swift-format >/dev/null 2>&1; then
          echo "swift-format unavailable (non-macOS or no Xcode) — skipping."
          exit 0
        fi
        xcrun swift-format format --in-place {staged_files}
        if ! git diff --exit-code --quiet -- {staged_files} 2>/dev/null; then
          git add -- {staged_files}
          echo ""
          echo "swift-format auto-formatted the staged files. Changes have been staged."
          echo "Re-run git commit to proceed."
          exit 1
        fi
        xcrun swift-format lint --strict {staged_files}
